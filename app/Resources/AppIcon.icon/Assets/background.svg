<?xml version="1.0" encoding="UTF-8"?>
<!-- VSL Finesse icon, back layer: brand.wine shading down to almost bg.base.
     Edge to edge: macOS cuts the icon's shape out of it. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wine" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a1428"/>
      <stop offset="1" stop-color="#1a0a11"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#wine)"/>
</svg>

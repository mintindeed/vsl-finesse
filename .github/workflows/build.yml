name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxi-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVSLP_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mac:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          APP="build/app/VSLPerformerApp_artefacts/Release/VSL Performer.app"
          CLI="build/cli/vslp_cli_artefacts/Release/vslp-finesse"
          # Ad-hoc signature: enough to run locally (right-click > Open the first time).
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/VSL-Performer-macOS.zip"
          cp "$CLI" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: VSL-Performer-macOS
          path: dist/

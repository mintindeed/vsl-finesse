name: Build

# Pull requests only: pushes to a branch build once it has a pull request
# open, and merging to main doesn't start another build. Run the workflow by
# hand from the Actions tab to build anything else.
on:
  pull_request:
    # Documentation-only changes don't need a (billed) build.
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  workflow_dispatch:

# A newer push to the same branch cancels a build that's still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Without the app, the engine, command line tool and tests only use
      # JUCE's core and audio_basics modules, which need no Linux packages.
      # But JUCE builds its juceaide helper while configuring, and that links
      # juce_graphics, which needs FreeType and fontconfig. Those two are all
      # this job installs, so a slow Ubuntu mirror costs as little as it can.
      # Make (already on the runner) instead of Ninja, which would come from apt.
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libfreetype-dev libfontconfig1-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVSLF_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mac:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Check for signing secrets
        id: signing
        # Only reports whether they exist; the secrets themselves are given to
        # the signing step alone, not to the build (which runs downloaded code).
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sign and notarize
        # Runs when the Developer ID secrets are set (they're never available to
        # pull requests from forks). See docs/DEVELOPMENT.md: "Signed builds".
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          scripts/sign-and-notarize.sh \
            "build/app/VSLFinesseApp_artefacts/Release/VSL Finesse.app" \
            "build/cli/vslf_cli_artefacts/Release/vsl-finesse" \
            dist
      - name: Package unsigned
        # Without the secrets: ad-hoc signature (right-click > Open the first time).
        if: steps.signing.outputs.available != 'true'
        run: |
          APP="build/app/VSLFinesseApp_artefacts/Release/VSL Finesse.app"
          CLI="build/cli/vslf_cli_artefacts/Release/vsl-finesse"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/VSL-Finesse-macOS.zip"
          cp "$CLI" dist/
      - uses: actions/upload-artifact@v7
        with:
          name: VSL-Finesse-macOS
          path: dist/

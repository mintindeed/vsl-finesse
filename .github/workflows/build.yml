name: Build

on:
  push:
    branches: [main, "claude/**"]
    # Documentation-only changes don't need a (billed) build.
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  workflow_dispatch:

# A newer push to the same branch cancels a build that's still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Engine tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxext-dev libxi-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVSLP_BUILD_APP=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  mac:
    name: macOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Check for signing secrets
        id: signing
        # Only reports whether they exist; the secrets themselves are given to
        # the signing step alone, not to the build (which runs downloaded code).
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          KEY: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then echo "available=true" >> "$GITHUB_OUTPUT"; else echo "available=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Sign and notarize
        # Runs when the Developer ID secrets are set (they're never available to
        # pull requests from forks). See README: "Signed builds".
        if: steps.signing.outputs.available == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          scripts/sign-and-notarize.sh \
            "build/app/VSLPerformerApp_artefacts/Release/VSL Performer.app" \
            "build/cli/vslp_cli_artefacts/Release/vslp-finesse" \
            dist
      - name: Package unsigned
        # Without the secrets: ad-hoc signature (right-click > Open the first time).
        if: steps.signing.outputs.available != 'true'
        run: |
          APP="build/app/VSLPerformerApp_artefacts/Release/VSL Performer.app"
          CLI="build/cli/vslp_cli_artefacts/Release/vslp-finesse"
          codesign --force --deep --sign - "$APP"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/VSL-Performer-macOS.zip"
          cp "$CLI" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: VSL-Performer-macOS
          path: dist/
